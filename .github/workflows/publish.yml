name: 'publish npm'

on:
  push:
    branches:
      - main

# Two jobs, so that the right to publish never shares a machine with third-party code.
#
# `build` runs `npm ci`, which installs every devDependency and runs their install scripts, then builds
# and tests. Any of those packages could be compromised, and a job holding `id-token: write` would let
# one of them request an OIDC token and publish its own version of bguard. So `build` cannot publish:
# it hands over a tarball and nothing else.
#
# `publish` holds `id-token: write`, installs nothing from the project, and publishes that tarball.
#
# What this does not prevent: code running in `build` can still change `lib/` before it is packed, and
# that tarball is published as it is. The split stops a compromised package from publishing a version of
# its choosing, not from tampering with this one.
#
# Actions are pinned to a commit SHA here, unlike in ci.yml: a tag can be moved to other code, and this
# workflow produces what gets published. The tag each SHA was taken from is in the comment beside it.
# No npm cache in either job, as setup-node recommends for publishing: whatever a poisoned cache put in
# node_modules would end up in the tarball.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes, so the token is not left on disk for npm ci

      - name: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false

      # Every merge to main runs this workflow, and a merge that does not bump the version (docs, CI,
      # dependencies) used to fail at the publish step. Such a merge now skips publishing instead. The
      # check only says "already published" when npm returns exactly this version, so a registry outage
      # leads to an attempted publish, never to a skipped release.
      - name: is this version already on npm
        id: release
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already published; the publish job will be skipped."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not on npm yet; it will be published."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ci
        run: npm ci

      - name: build:package
        run: npm run build:package

      - name: check:package
        run: npm run check:package

      - name: lint:check
        run: npm run lint:check

      - name: test:coverage
        run: npm run test:coverage

      # `--ignore-scripts`: the build has already run, and the tarball should be exactly what was tested.
      - name: pack
        run: npm pack --ignore-scripts

      - name: upload tarball
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: bguard-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing: the job proves its identity to npm over OIDC, so no token exists
    steps:
      - name: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1+. Node 24 ships an npm 11, but which one depends on the patch
      # release the runner resolves, so it is pinned to an exact version: this job holds the publish
      # permission, and a later npm release, good or bad, should not run here unreviewed.
      - name: npm with trusted publishing
        run: npm install -g npm@11.21.2

      - name: download tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # Publishes over OIDC, with no token to expire or leak; write tokens now expire after 90 days, and
      # one did, failing the 0.11.0 release. Provenance is attached automatically. The trusted publisher
      # on npmjs.com has to allow `npm publish`, not only `npm stage publish`.
      - name: publish
        run: npm publish ./bguard-*.tgz --access public
